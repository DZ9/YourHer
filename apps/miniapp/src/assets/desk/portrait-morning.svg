<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" preserveAspectRatio="xMidYMin meet">
  <defs>
    <radialGradient id="faceFillMorning" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFCF4"/>
      <stop offset="100%" stop-color="#FFFCF4" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Halo rings — morning warm peach (subtle, follows ambient bg) -->
  <circle cx="100" cy="105" r="110" fill="none" stroke="#E89456" stroke-opacity="0.28" stroke-width="1.2"/>
  <circle cx="100" cy="105" r="130" fill="none" stroke="#E89456" stroke-opacity="0.16" stroke-width="1"/>
  <circle cx="100" cy="105" r="152" fill="none" stroke="#E89456" stroke-opacity="0.09" stroke-width="1"/>
  <circle cx="100" cy="105" r="178" fill="none" stroke="#E89456" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Scarf (morning warm wood) -->
  <path d="M 44 170 Q 100 178 156 170 L 158 188 Q 100 196 42 188 Z"
        fill="#D7A36A" stroke="#3B3528" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 146 186 L 152 196 L 156 184 Z"
        fill="#A47940" stroke="#3B3528" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 96 172 Q 100 177 104 172"
        fill="none" stroke="#3B3528" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

  <!-- Face -->
  <circle cx="100" cy="105" r="62" fill="url(#faceFillMorning)" stroke="#3B3528" stroke-width="1.8"/>
  <circle cx="88" cy="98" r="50" fill="rgba(232, 195, 140, 0.10)"/>

  <!-- Cheeks (morning peach) -->
  <ellipse cx="78" cy="118" rx="6" ry="3" fill="#E9A98A" opacity="0.5"/>
  <ellipse cx="122" cy="118" rx="6" ry="3" fill="#E9A98A" opacity="0.5"/>

  <!-- Eyes -->
  <ellipse cx="84" cy="104" rx="3" ry="3.2" fill="#3B3528"/>
  <ellipse cx="116" cy="104" rx="3" ry="3.2" fill="#3B3528"/>
  <circle cx="84.7" cy="102.6" r="0.7" fill="#FFFCF4"/>
  <circle cx="116.7" cy="102.6" r="0.7" fill="#FFFCF4"/>

  <!-- Mouth -->
  <path d="M 91 118 q 9 5 18 0"
        stroke="#3B3528" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
