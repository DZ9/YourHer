<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" preserveAspectRatio="xMidYMin meet">
  <defs>
    <radialGradient id="faceFillNoon" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFCF4"/>
      <stop offset="100%" stop-color="#FFFCF4" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Halo rings — 暖橘 (匹配设计稿默认暖色 mood ringHue #E89456 的更柔和版本) -->
  <circle cx="100" cy="105" r="110" fill="none" stroke="#D8985C" stroke-opacity="0.34" stroke-width="1.2"/>
  <circle cx="100" cy="105" r="130" fill="none" stroke="#D8985C" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="100" cy="105" r="152" fill="none" stroke="#D8985C" stroke-opacity="0.13" stroke-width="1"/>
  <circle cx="100" cy="105" r="178" fill="none" stroke="#D8985C" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Scarf (under chin) -->
  <path d="M 44 170 Q 100 178 156 170 L 158 188 Q 100 196 42 188 Z"
        fill="#B68A5E" stroke="#3B3528" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 146 186 L 152 196 L 156 184 Z"
        fill="#8E6B47" stroke="#3B3528" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 96 172 Q 100 177 104 172"
        fill="none" stroke="#3B3528" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

  <!-- Face -->
  <circle cx="100" cy="105" r="62" fill="url(#faceFillNoon)" stroke="#3B3528" stroke-width="1.8"/>
  <circle cx="96" cy="98" r="50" fill="rgba(232, 195, 140, 0.10)"/>

  <!-- Cheeks -->
  <ellipse cx="78" cy="118" rx="6" ry="3" fill="#D8A289" opacity="0.5"/>
  <ellipse cx="122" cy="118" rx="6" ry="3" fill="#D8A289" opacity="0.5"/>

  <!-- Eyes -->
  <ellipse cx="84" cy="104" rx="3" ry="3.2" fill="#3B3528"/>
  <ellipse cx="116" cy="104" rx="3" ry="3.2" fill="#3B3528"/>
  <circle cx="84.7" cy="102.6" r="0.7" fill="#FFFCF4"/>
  <circle cx="116.7" cy="102.6" r="0.7" fill="#FFFCF4"/>

  <!-- Mouth (idle smile) -->
  <path d="M 91 118 q 9 5 18 0"
        stroke="#3B3528" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
