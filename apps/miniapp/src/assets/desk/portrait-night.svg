<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" preserveAspectRatio="xMidYMin meet">
  <defs>
    <radialGradient id="faceFillNight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFCF4"/>
      <stop offset="100%" stop-color="#FFFCF4" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Halo rings — night cool moonlight (lifted opacity for visibility on dark bg) -->
  <circle cx="100" cy="105" r="110" fill="none" stroke="#8FAACB" stroke-opacity="0.36" stroke-width="1.2"/>
  <circle cx="100" cy="105" r="130" fill="none" stroke="#8FAACB" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="100" cy="105" r="152" fill="none" stroke="#8FAACB" stroke-opacity="0.13" stroke-width="1"/>
  <circle cx="100" cy="105" r="178" fill="none" stroke="#8FAACB" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Scarf (night deep blue) -->
  <path d="M 44 170 Q 100 178 156 170 L 158 188 Q 100 196 42 188 Z"
        fill="#3D4A66" stroke="#3B3528" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 146 186 L 152 196 L 156 184 Z"
        fill="#28324A" stroke="#3B3528" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 96 172 Q 100 177 104 172"
        fill="none" stroke="#3B3528" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

  <!-- Face -->
  <circle cx="100" cy="105" r="62" fill="url(#faceFillNight)" stroke="#3B3528" stroke-width="1.8"/>
  <circle cx="112" cy="98" r="50" fill="rgba(255, 255, 255, 0.04)"/>

  <!-- Cheeks (cool) -->
  <ellipse cx="78" cy="118" rx="6" ry="3" fill="#E9A98A" opacity="0.4"/>
  <ellipse cx="122" cy="118" rx="6" ry="3" fill="#E9A98A" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="84" cy="104" rx="3" ry="3.2" fill="#3B3528"/>
  <ellipse cx="116" cy="104" rx="3" ry="3.2" fill="#3B3528"/>
  <circle cx="84.7" cy="102.6" r="0.7" fill="#FFFCF4"/>
  <circle cx="116.7" cy="102.6" r="0.7" fill="#FFFCF4"/>

  <!-- Mouth -->
  <path d="M 91 118 q 9 5 18 0"
        stroke="#3B3528" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
