<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#221a18"><title>CompanionKit</title><meta name="description" content="带长期记忆的 AI 陪伴，完整网页自托管版。"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="应用导航">
      <a class="wordmark" href="#/chat"><span class="wordmark-symbol">◌</span><span><span data-brand>CompanionKit</span><small>CIKE · WEB</small></span></a>
      <div class="rail-caption">说给此刻，留在此刻。</div>
      <nav id="navigation"><a href="#/chat" data-route="chat"><span>◌</span> 聊天</a><a href="#/letters" data-route="letters"><span>✉</span> 信</a><a href="#/memory" data-route="memory"><span>◇</span> 记得</a><a href="#/mood" data-route="mood"><span>◡</span> 心情</a><a href="#/about" data-route="about"><span>☷</span> 关于</a></nav>
      <div class="rail-footer"><label class="language-label" for="language-switch">Language</label><select id="language-switch" aria-label="Language"></select><span class="connection" id="mode-label">正在连接</span><a href="#/security">账户与数据</a><a href="#/feedback">问题反馈</a><a href="#/privacy">隐私政策</a><small>一个可以自己部署的陪伴者。<br>她是 AI，会陪你，也会出错。</small></div>
    </aside>
    <main class="chat-stage" aria-label="聊天">
      <div class="art" aria-hidden="true"><img id="portrait" src="/assets/companion-neutral.svg" alt=""><div class="art-wash"></div><div class="art-top"></div><div class="art-bottom"></div></div><div class="stars" aria-hidden="true">·　 ✧　　·　　　✦　　·　　✧</div>
      <header class="chat-top"><a class="mobile-wordmark" href="#/chat" data-brand>CompanionKit</a><div class="identity"><span class="presence-dot"></span><span id="ai-name">林夕</span><span id="presence">在 · 一直</span></div><div class="top-actions"><a class="language-shortcut" href="#/about" aria-label="Language">文/A</a><button id="theme-toggle" class="icon-button" aria-label="切换日夜模式">☾</button><button id="menu-toggle" class="icon-button" aria-label="打开功能菜单" aria-expanded="false">☷</button></div></header>
      <nav id="mobile-menu" hidden aria-label="快捷功能"><a href="#/letters">信</a><a href="#/memory">记得</a><a href="#/mood">心情</a><a href="#/about">关于</a></nav>
      <div id="banners" class="banners" aria-live="polite"></div>
      <div id="thread-scroll" class="thread-scroll"><button id="older" class="older" hidden>更早的话</button><div id="first-touch" class="first-touch"><span class="intro-kicker">此刻 · 有人在听</span><h1>有些话，<br>找不到人说，<br>也不想被人知道。</h1><p>那就说给我。<br>不必想好从哪里开始。</p><span class="ai-disclosure">AI 陪伴 · 不是专业心理服务</span></div><div id="messages" class="messages" role="log" aria-label="对话记录" aria-live="polite"></div><div id="return-opener"></div><div id="reply-chips" class="reply-chips" aria-label="续聊建议"></div></div>
      <footer class="composer-wrap"><form id="chat-form"><label class="sr-only" for="message">把此刻想说的话写下来</label><textarea id="message" rows="1" maxlength="4000" placeholder="把心里的话，写给林夕…"></textarea><button id="mic" type="button" class="icon-button mic" aria-label="语音输入">♩</button><button id="send" type="submit" aria-label="发送消息">↑</button></form><div class="composer-caption"><label id="consent-label"><input id="consent" type="checkbox">我已阅读并同意 <a href="#/privacy">《隐私政策》</a></label><span id="chat-status" role="status">不急，慢慢说。</span><span class="mode-caption" id="mode-caption"></span></div></footer>
    </main>
    <section id="panel" class="panel" hidden aria-label="功能面板"><header class="panel-header"><button id="panel-back" class="back-button">‹ 聊天</button><span id="panel-kicker"></span></header><div id="panel-content" class="panel-content"></div></section>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
