<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474" role="img" aria-labelledby="title desc">
  <title id="title">YourHer architecture</title>
  <desc id="desc">The web app and WeChat Mini Program connect to one YourHer server. Conversation, memory, mood, letters, profiles and sessions share a model adapter and local JSON records.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#302b35}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#87755f}.title{font-size:30px;font-weight:650;letter-spacing:-.6px}.sub{font-size:16px;fill:#776f79}.label{font-size:20px;font-weight:600}.body{font-size:15px;fill:#776f79}.small{font-size:13px;fill:#847b84}.kicker{font-size:12px;fill:#8a7b68;letter-spacing:1.3px;font-weight:600}.line{fill:none;stroke:#aaa0b0;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#aaa0b0" stroke-width="1.4" />
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="473" rx="20" fill="#faf8f5" stroke="#e5dfd7" />
  <text x="44" y="39" class="eyebrow">YOURHER / ARCHITECTURE</text>
  <text x="44" y="84" class="title">Two clients. One companion engine.</text>
  <text x="44" y="113" class="sub">Two interfaces connected to the same conversation, memory and model services.</text>
  <rect x="44" y="158" width="226" height="106" rx="14" fill="#fff" stroke="#e1dce4" />
  <text x="64" y="183" class="kicker">BROWSER</text>
  <text x="64" y="213" class="label">Web app</text>
  <text x="64" y="240" class="small">Responsive HTML / CSS / JS</text>
  <rect x="44" y="286" width="226" height="106" rx="14" fill="#fff" stroke="#e1dce4" />
  <text x="64" y="311" class="kicker">WECHAT</text>
  <text x="64" y="341" class="label">Mini Program</text>
  <text x="64" y="368" class="small">Original native WXML / WXSS</text>
  <rect x="346" y="146" width="508" height="264" rx="18" fill="#f1edf5" stroke="#d6cddd" />
  <text x="370" y="181" class="label">YourHer server</text>
  <text x="370" y="207" class="body">Shared services · one Node.js process</text>
  <rect x="370" y="228" width="218" height="72" rx="10" fill="#fcfbfd" stroke="#e0d8e7" />
  <text x="386" y="257" class="label">Conversation</text>
  <text x="386" y="281" class="small">Streaming · bubbles · chips</text>
  <rect x="612" y="228" width="218" height="72" rx="10" fill="#fcfbfd" stroke="#e0d8e7" />
  <text x="628" y="257" class="label">Memory</text>
  <text x="628" y="281" class="small">Extract · rank · forget</text>
  <rect x="370" y="312" width="218" height="72" rx="10" fill="#fcfbfd" stroke="#e0d8e7" />
  <text x="386" y="341" class="label">Mood &amp; letters</text>
  <text x="386" y="365" class="small">Check-ins · weekly letters</text>
  <rect x="612" y="312" width="218" height="72" rx="10" fill="#fcfbfd" stroke="#e0d8e7" />
  <text x="628" y="341" class="label">Profiles &amp; sessions</text>
  <text x="628" y="365" class="small">Preferences · user isolation</text>
  <rect x="930" y="158" width="226" height="106" rx="14" fill="#fffdf9" stroke="#e5d9c7" />
  <text x="950" y="190" class="label">Model provider</text>
  <text x="950" y="217" class="body">OpenAI-compatible API</text>
  <text x="950" y="240" class="small">or built-in scripted demo</text>
  <rect x="930" y="286" width="226" height="106" rx="14" fill="#fffdf9" stroke="#e5d9c7" />
  <text x="950" y="318" class="label">Local records</text>
  <text x="950" y="345" class="body">JSON storage</text>
  <text x="950" y="368" class="small">on your own instance</text>
  <path d="M270 211H342" class="line" marker-end="url(#arrow)" />
  <path d="M270 339H342" class="line" marker-end="url(#arrow)" />
  <path d="M854 211H926" class="line" marker-end="url(#arrow)" />
  <path d="M854 339H926" class="line" marker-end="url(#arrow)" />
  <text x="44" y="447" class="kicker">CLIENTS</text>
  <text x="346" y="447" class="kicker">REUSABLE CORE</text>
  <text x="930" y="447" class="kicker">YOUR INFRASTRUCTURE</text>
</svg>
