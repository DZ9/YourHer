<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="446" viewBox="0 0 1200 446" role="img" aria-labelledby="title desc">
  <title id="title">YourHer conversation lifecycle</title>
  <desc id="desc">Build context, stream a reply with chip markers withheld, persist the reply, then analyze facts. Accepted memories are available to subsequent turns. Optional analysis failure does not discard the reply.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#302b35}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#87755f}.title{font-size:30px;font-weight:650;letter-spacing:-.6px}.sub{font-size:16px;fill:#776f79}.label{font-size:20px;font-weight:600}.body{font-size:15px;fill:#776f79}.small{font-size:13px;fill:#847b84}.kicker{font-size:12px;fill:#8a7b68;letter-spacing:1.3px;font-weight:600}.line{fill:none;stroke:#aaa0b0;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#aaa0b0" stroke-width="1.4" />
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="445" rx="20" fill="#faf8f5" stroke="#e5dfd7" />
  <text x="44" y="39" class="eyebrow">YOURHER / CONVERSATION LIFECYCLE</text>
  <text x="44" y="84" class="title">A conversation that carries forward.</text>
  <text x="44" y="113" class="sub">Persist the reply first. Analyze facts afterward. Reuse accepted memories in future turns.</text>
  <rect x="44" y="160" width="254" height="170" rx="14" fill="#fff" stroke="#e1dce4" />
  <circle cx="73" cy="190" r="15" fill="#eee8df" />
  <text x="73" y="194.5" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#8a7b68">01</text>
  <text x="64" y="233" class="label">Build context</text>
  <text x="64" y="268" class="body">Profile, recent history,</text>
  <text x="64" y="291" class="body">summary and saved memories</text>
  <path d="M303 245H325" class="line" marker-end="url(#arrow)" />
  <rect x="330" y="160" width="254" height="170" rx="14" fill="#fff" stroke="#e1dce4" />
  <circle cx="359" cy="190" r="15" fill="#eee8df" />
  <text x="359" y="194.5" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#8a7b68">02</text>
  <text x="350" y="233" class="label">Generate a reply</text>
  <text x="350" y="268" class="body">Stream visible text; withhold</text>
  <text x="350" y="291" class="body">partial reply-chip markers</text>
  <path d="M589 245H611" class="line" marker-end="url(#arrow)" />
  <rect x="616" y="160" width="254" height="170" rx="14" fill="#fff" stroke="#e1dce4" />
  <circle cx="645" cy="190" r="15" fill="#eee8df" />
  <text x="645" y="194.5" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#8a7b68">03</text>
  <text x="636" y="233" class="label">Save the conversation</text>
  <text x="636" y="268" class="body">Persist the reply, raw content</text>
  <text x="636" y="291" class="body">and parsed reply chips</text>
  <path d="M875 245H897" class="line" marker-end="url(#arrow)" />
  <rect x="902" y="160" width="254" height="170" rx="14" fill="#f1edf5" stroke="#d6cddd" />
  <circle cx="931" cy="190" r="15" fill="#78648c" />
  <text x="931" y="194.5" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#fff">04</text>
  <text x="922" y="233" class="label">Analyze &amp; remember</text>
  <text x="922" y="268" class="body">Validate extracted facts;</text>
  <text x="922" y="291" class="body">update memory and profile</text>
  <path d="M1029 330V374H171V335" class="line" marker-end="url(#arrow)" />
  <rect x="440" y="360" width="320" height="28" rx="0" fill="#faf8f5" stroke="#faf8f5" />
  <text x="600" y="379" class="body" text-anchor="middle">Accepted facts enrich the next turn</text>
  <text x="44" y="421" class="small">Analysis is gated and may fail independently. A saved reply is kept even if extraction fails.</text>
</svg>
