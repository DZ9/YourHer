name: Test standalone application and memory package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test packages/memory/test/*.test.js packages/conversation/test/*.test.js packages/i18n/test/*.test.js apps/web/test/*.test.js
      - run: node evals/run.js
      - run: node scripts/check-miniapp.mjs
